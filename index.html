<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculadora">
  <title>Calculadora</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body data-screen="home">
  <section id="home-page" aria-label="Inicio">
    <div class="home-content"><button id="start-routine" disabled>Comenzar</button><button id="home-settings">Ajustes</button><p id="home-status" role="status"></p></div>
  </section>
  <div id="iphone-home" role="button" tabindex="0" aria-label="Abrir calculadora"><img id="iphone-home-image" alt=""></div>
  <button id="settings-open" aria-label="Ajustes de la calculadora">⚙</button>
  <section id="settings-panel" class="panel settings" hidden aria-label="Ajustes de la calculadora">
    <h2>Ajustes</h2>
    <label class="force-settings">Número a forzar<input id="force-number" type="text" inputmode="decimal" placeholder="1000" autocomplete="off"></label>
    <p id="force-status" role="status"></p>
    <label class="upload"><span id="home-upload-label">Inicio del iPhone</span><input id="home-screenshot-upload" aria-label="Captura del inicio del iPhone" type="file" accept="image/png,image/jpeg,image/webp"></label>
    <label class="upload"><span id="ac-upload-label">Calculadora · AC</span><input id="screenshot-upload" aria-label="Captura de la calculadora con AC" type="file" accept="image/png,image/jpeg,image/webp"></label>
    <label class="upload"><span id="delete-upload-label">Calculadora · Borrar</span><input id="screenshot-delete-upload" aria-label="Captura de la calculadora con borrar" type="file" accept="image/png,image/jpeg,image/webp"></label>
    <p id="screenshot-status" role="status"></p>
    <button id="settings-close">Listo</button>
  </section>
  <div id="calculator-scene">
  <div id="screenshot-stage" hidden aria-hidden="true"><img id="screenshot-image" alt=""><div id="clear-skin" hidden><canvas id="clear-ac-image"></canvas><canvas id="clear-delete-image"></canvas></div><div class="status-mask"></div><div class="home-mask"></div></div>
  <button class="history-toggle" aria-label="Historial" id="history"><svg viewBox="0 0 26 22" aria-hidden="true"><path d="M8 3h17M8 11h17M8 19h17"/><g fill="currentColor" stroke="none"><circle cx="2" cy="3" r="1.7"/><circle cx="2" cy="11" r="1.7"/><circle cx="2" cy="19" r="1.7"/></g></svg></button>
  <section class="panel" id="history-panel" hidden aria-label="Historial de cálculos"><strong>Historial</strong><div id="history-items"><p>Sin cálculos</p></div><button id="close-history">Listo</button></section>
  <section class="panel" id="mode-panel" hidden aria-label="Modo de calculadora"><strong>Calculadora</strong><p>✓ Básica</p><button id="close-mode">Listo</button></section>
  <main class="calculator" aria-label="Calculadora">
    <div class="display" aria-label="Resultado" aria-live="polite" aria-atomic="true"><span id="result">0</span></div>
    <div class="keypad">
      <button class="utility" data-key="clear" aria-label="Borrar todo" id="clear">AC</button>
      <button class="utility sign" data-key="sign" aria-label="Cambiar signo"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 7v9M7.5 11.5h9M30 5L12 35M27 30h10"/></svg></button>
      <button class="utility" data-key="percent" aria-label="Porcentaje">%</button>
      <button class="operator" data-key="divide" aria-label="Dividir"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M2 15h26"/><circle cx="15" cy="5" r="1" fill="currentColor"/><circle cx="15" cy="25" r="1" fill="currentColor"/></svg></button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button class="operator" data-key="multiply" aria-label="Multiplicar"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="m5 5 20 20M25 5 5 25"/></svg></button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button class="operator" data-key="subtract" aria-label="Restar"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M2 15h26"/></svg></button>
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button class="operator" data-key="add" aria-label="Sumar"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M2 15h26M15 2v26"/></svg></button>
      <button class="mode" id="mode" aria-label="Modo de calculadora"><svg viewBox="0 0 26 38" aria-hidden="true"><rect x="2" y="2" width="22" height="34" rx="4" fill="currentColor" stroke="none"/><rect x="5" y="5" width="16" height="7" rx="1.5" fill="#2a2a2c" stroke="none"/><g fill="#2a2a2c" stroke="none"><circle cx="7" cy="17" r="2.3"/><circle cx="13" cy="17" r="2.3"/><circle cx="19" cy="17" r="2.3"/><circle cx="7" cy="23" r="2.3"/><circle cx="13" cy="23" r="2.3"/><circle cx="19" cy="23" r="2.3"/><circle cx="7" cy="29" r="2.3"/><circle cx="13" cy="29" r="2.3"/><circle cx="19" cy="29" r="2.3"/><circle cx="7" cy="34" r="2.3"/><circle cx="13" cy="34" r="2.3"/><circle cx="19" cy="34" r="2.3"/></g></svg></button><button class="zero" data-key="0">0</button><button data-key="decimal" aria-label="Coma decimal">,</button>
      <button class="operator" data-key="equals" aria-label="Igual"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M4 10h22M4 21h22"/></svg></button>
    </div>
  </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
